<div class="shell" [class.shell--nav-open]="mobileNavOpen()">
  <aside
    class="sidebar"
    [class.sidebar--open]="mobileNavOpen()"
    aria-label="Hauptnavigation"
  >
    <a routerLink="/dashboard" class="brand" (click)="mobileNavOpen.set(false)">
      <span class="brand-mark" aria-hidden="true">BA</span>
      <span class="brand-name">Briefing Agent</span>
    </a>

    <nav class="nav" aria-label="Primärnavigation">
      @for (group of navGroups; track group.label) {
        <div class="nav-group">
          <div class="nav-group-label">{{ group.label }}</div>
          <ul class="nav-list">
            @for (item of group.items; track item.path) {
              <li>
                <a
                  [routerLink]="item.path"
                  routerLinkActive="nav-item--active"
                  [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
                  class="nav-item"
                >
                  <svg class="nav-icon" aria-hidden="true" focusable="false">
                    <use [attr.href]="'#' + item.iconId"></use>
                  </svg>
                  <span class="nav-label">{{ item.label }}</span>
                </a>
              </li>
            }
          </ul>
        </div>
      }
    </nav>
  </aside>

  <button
    type="button"
    class="mobile-backdrop"
    [class.mobile-backdrop--visible]="mobileNavOpen()"
    aria-label="Navigation schließen"
    (click)="mobileNavOpen.set(false)"
  ></button>

  <header class="topbar">
    <button
      type="button"
      class="nav-toggle"
      aria-label="Navigation öffnen"
      [attr.aria-expanded]="mobileNavOpen()"
      (click)="toggleMobileNav()"
    >
      <svg class="nav-toggle-icon" aria-hidden="true" focusable="false">
        <use href="#icon-menu"></use>
      </svg>
    </button>

    <form class="global-search" [formGroup]="searchForm" (submit)="onSearchSubmit($event)">
      <svg class="global-search-icon" aria-hidden="true" focusable="false">
        <use href="#icon-search"></use>
      </svg>
      <input
        #searchInput
        type="search"
        class="global-search-input"
        placeholder='Suche · "/" zum Fokussieren'
        formControlName="q"
        autocomplete="off"
        aria-label="Globale Suche"
      />
    </form>

    <div class="user-menu">
      @if (currentUser(); as user) {
        <span class="user-name" [attr.aria-label]="'Eingeloggt als ' + user.fullName">{{ user.fullName }}</span>
      }
      <button type="button" class="brand-button" (click)="logout()">Abmelden</button>
    </div>
  </header>

  <main id="main-content" class="content" tabindex="-1">
    <router-outlet />
  </main>
</div>
