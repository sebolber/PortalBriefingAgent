<div class="shell">
  <header class="topbar">
    <a routerLink="/dashboard" class="brand">Briefing Agent</a>

    <nav class="primary-nav" aria-label="Hauptnavigation">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      <a routerLink="/capture" routerLinkActive="active">Neues Ereignis</a>
    </nav>

    <div class="user-menu">
      @if (currentUser(); as user) {
        <span class="user-name" [attr.aria-label]="'Eingeloggt als ' + user.fullName">{{ user.fullName }}</span>
      }
      <button type="button" class="brand-button" (click)="logout()">Abmelden</button>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
