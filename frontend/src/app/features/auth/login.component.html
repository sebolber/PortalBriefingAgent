<div class="login-page">
  <section class="login-card surface-card">
    <h1>Briefing Agent</h1>
    <p class="subtitle">Anmeldung mit lokalem Account</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="username">Benutzername</label>
      <input
        id="username"
        type="text"
        autocomplete="username"
        formControlName="username"
        class="brand-input"
        [attr.aria-invalid]="form.controls.username.invalid && form.controls.username.touched"
      />

      <label for="password">Passwort</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        formControlName="password"
        class="brand-input"
        [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
      />

      @if (error(); as message) {
        <p class="error" role="alert">{{ message }}</p>
      }

      <button
        type="submit"
        class="brand-button submit"
        [disabled]="submitting()"
      >
        @if (submitting()) {
          <span>Bitte warten…</span>
        } @else {
          <span>Anmelden</span>
        }
      </button>
    </form>
  </section>
</div>
