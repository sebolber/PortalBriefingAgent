name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run tests (unit + integration) and Sonar scan
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            mvn -B -ntp verify \
              org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar \
              -Dsonar.projectBaseDir="$GITHUB_WORKSPACE"
          else
            echo "SONAR_TOKEN not configured — skipping Sonar scan."
            mvn -B -ntp verify
          fi

      - name: Refresh Sonar issue snapshot
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT_FOR_SCAN: "1"
        run: |
          gh label create sonar-snapshot --description "Auto-managed Sonar issue snapshot" --color 0075ca --force >/dev/null 2>&1 || true
          body_file="$(mktemp)"
          bash scripts/fetch-sonar-issues.sh > "$body_file"
          issue_number=$(gh issue list --label sonar-snapshot --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file "$body_file"
            echo "Updated issue #${issue_number}"
          else
            gh issue create --title "Sonar Issue Snapshot — main" --label sonar-snapshot --body-file "$body_file"
          fi

      - name: Upload surefire/failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/briefing-agent
          retention-days: 1

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: briefing_agent
          POSTGRES_PASSWORD: briefing_agent
          POSTGRES_DB: briefing_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U briefing_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate encryption master key
        run: |
          echo "BA_TEST_SECRET_KEY=$(head -c 32 /dev/urandom | base64)" >> "$GITHUB_ENV"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Stage frontend bundle as Spring static resources
        run: |
          rm -rf backend/src/main/resources/static
          mkdir -p backend/src/main/resources/static
          if [ -d frontend/dist/briefing-agent/browser ]; then
            cp -r frontend/dist/briefing-agent/browser/. backend/src/main/resources/static/
          else
            cp -r frontend/dist/briefing-agent/. backend/src/main/resources/static/
          fi

      - name: Build backend jar
        working-directory: backend
        run: mvn -B -ntp -DskipTests -Pskip-integration-tests clean package

      - name: Start backend
        env:
          BRIEFINGAGENT_SECRET_KEY: ${{ env.BA_TEST_SECRET_KEY }}
        run: |
          cd backend
          nohup java -jar target/briefing-agent-backend.jar \
            --spring.profiles.active=dev \
            --briefingagent.crypto.secret-key="${BRIEFINGAGENT_SECRET_KEY}" \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/briefing_agent \
            --spring.datasource.username=briefing_agent \
            --spring.datasource.password=briefing_agent \
            > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null 2>&1; then
              echo "Backend is ready (after ${i} attempts)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not become ready within 3 minutes"
          tail -200 backend/backend.log || true
          exit 1

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill "$(cat backend/backend.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
          if-no-files-found: ignore
