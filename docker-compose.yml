services:
  db:
    image: postgres:16-alpine
    container_name: briefing-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: briefing_agent
      POSTGRES_USER: briefing_agent
      POSTGRES_PASSWORD: briefing_agent
    ports:
      - "5432:5432"
    volumes:
      - briefing_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefing_agent -d briefing_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local OpenAI-compatible Whisper API for audio capture. CPU image is
  # used so the dev setup works on any laptop; switch the WHISPER_MODEL
  # env to a larger checkpoint for better quality once you have GPU
  # support. Audio is streamed by the backend, the container itself does
  # not persist anything to disk other than the cached model weights.
  whisper:
    image: ghcr.io/fedirz/faster-whisper-server:latest-cpu
    container_name: briefing-agent-whisper
    restart: unless-stopped
    ports:
      - "9000:8000"
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
    volumes:
      - briefing_agent_whisper_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  briefing_agent_pgdata:
  briefing_agent_whisper_cache:
