services:
  db:
    image: postgres:16-alpine
    container_name: briefing-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: briefing_agent
      POSTGRES_USER: briefing_agent
      POSTGRES_PASSWORD: briefing_agent
    ports:
      - "5432:5432"
    volumes:
      - briefing_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefing_agent -d briefing_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local OpenAI-compatible Whisper API for audio capture. The CPU image
  # works on any laptop; switch the image tag to `latest-cuda` and set
  # WHISPER__INFERENCE_DEVICE=cuda for a GPU host. The container caches
  # model weights into a named volume so repeat starts are fast.
  #
  # The project was previously published as
  # `ghcr.io/fedirz/faster-whisper-server` and renamed to
  # `speaches-ai/speaches`; the new image keeps the OpenAI-compatible
  # `/v1/audio/transcriptions` endpoint on port 8000.
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: briefing-agent-whisper
    restart: unless-stopped
    ports:
      - "9000:8000"
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
    volumes:
      - briefing_agent_whisper_cache:/home/ubuntu/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  briefing_agent_pgdata:
  briefing_agent_whisper_cache:
